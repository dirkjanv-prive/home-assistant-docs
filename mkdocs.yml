site_name: Home Assistant GitOps
site_description: GitOps-beheer voor Home Assistant met een knop
theme:
  name: material
  language: nl
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Donker thema
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Licht thema
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - toc.integrate
    - content.code.copy

nav:
  - Home: index.md
  - Architectuur: architectuur.md
  - Beveiliging: beveiliging.md
  - Werkwijze: werkwijze.md
  - Apply-stap: runner-setup.md
  - Agent-geheugen: agent-geheugen.md
  - Agent-webapp: agent-webapp.md
  - Agent-configuratie (technisch): agent-configuratie.md
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search
